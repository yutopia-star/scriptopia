<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhittleScript Platform</title>
    <meta name="description" content="Audience intelligence for screenplay discovery. Where writers, readers, and industry professionals connect through real engagement data." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <style>
      html { background-color: #0A0A0B; }
      html.light { background-color: #FAFAFA; }
    </style>
    <script>
      (function() {
        var stored = localStorage.getItem('whittlescript-theme');
        var theme = stored || 'dark';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
        if (!isDark) document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
